<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Tracker RCP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
  <h1>Time Tracker</h1>

  <!-- Panel Przycisków -->
  <div class="controls-grid">
    <button id="btn-start" class="btn-green">Start Pracy</button>
    <button id="btn-stop" class="btn-red">Stop Pracy</button>
    
    <!-- Przyciski wyjść (znikają podczas wyjścia) -->
    <button id="btn-private" class="btn-orange">Wyjście Prywatne</button>
    <button id="btn-business" class="btn-blue">Wyjście Służbowe</button>

    <!-- Przycisk powrotu (pojawia się TYLKO podczas wyjścia) -->
    <button id="btn-return" class="btn-green" style="display: none;">POWRÓT Z WYJŚCIA</button>
  </div>

  <p id="status-msg">Gotowy do rejestracji czasu.</p>
  <hr />

  <h2>Historia sesji</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Start</th>
        <th>Stop</th>
        <th>Czas</th>
        <th>Typ zdarzenia</th>
      </tr>
    </thead>
    <tbody id="logs-table-body"></tbody>
  </table>
</main>

  <script type="module" src="./main.js"></script>
</body>
</html>
